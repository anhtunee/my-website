<style id="css">

}
@media (prefers-color-scheme:dark){

:root[data-theme="dark"]{

  --sun:#FFC24D;--coral:#FF8A6E;--coral-soft:#3A2620;--rain:#86A9F0;--rain-soft:#1E2C47;
  --line:#26444F;--danger:#FF8A70;--ok:#6CD3A0;color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 16px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.55 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}

button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--sea)}
:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 14px 120px}
.btn.swap{white-space:nowrap;font-size:14px;gap:6px}

/* hero */
.hero{background:var(--hero);color:var(--hero-ink);padding:22px 18px 20px;border-radius:0 0 26px 26px;margin:0 -14px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-50px;width:170px;height:170px;border-radius:50%;background:var(--sun);opacity:.85}

.tide{margin-top:18px;background:rgba(255,255,255,.6);border-radius:18px;padding:12px 14px}

.tide-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:12.5px;font-weight:600}
.tide-row strong{font-size:21px;font-weight:800;letter-spacing:-.01em;display:block}

.plus{border:0;background:var(--coral-soft);color:var(--coral);border-radius:10px;font-weight:700;padding:6px 10px;min-height:34px;white-space:nowrap}
.tide-bar{position:relative;height:12px;border-radius:999px;background:rgba(15,45,58,.12);margin:10px 0 8px}
.tide-fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--coral)}
.tide-plan{position:absolute;top:-4px;bottom:-4px;width:3px;border-radius:2px;background:currentColor}
.tide-legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px}
.tide-legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--coral)}
.tide-legend span.plan::before{width:3px;background:currentColor}
.over{color:var(--danger);font-weight:800}

/* navigation: sticky segmented tabs under the hero (reliable in iOS Safari and in-app browsers) */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--bg);display:flex;gap:4px;padding:12px 0 8px;margin:0}
.nav::before{content:"";position:absolute;inset:12px 0 8px;border-radius:16px;background:var(--surface-2);z-index:-1}
.tab{flex:1;border:0;background:transparent;border-radius:13px;margin:4px 2px;padding:6px 4px;min-height:42px;display:flex;flex-direction:row;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:700;color:var(--muted);white-space:nowrap}
.tab i{font-style:normal;font-size:16px;line-height:1}
.tab[aria-selected="true"]{color:var(--sea);background:var(--surface);box-shadow:0 1px 3px rgba(15,45,58,.12)}
@media (max-width:360px){.tab{font-size:13px;gap:4px}.tab i{font-size:14px}}

/* day switch */
.days{display:flex;gap:8px;overflow-x:auto;padding:16px 2px 4px;margin:0 -14px;padding-left:14px;padding-right:14px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day-btn{flex:0 0 auto;border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:8px 16px;text-align:left;min-height:52px}
.day-btn b{display:block;font-size:15px}
.day-btn small{color:var(--muted);font-size:12px}
.day-btn[aria-pressed="true"]{border-color:var(--sea);background:var(--sea);color:var(--sea-ink)}
.day-btn[aria-pressed="true"] small{color:inherit;opacity:.85}
.toolbar{display:flex;gap:8px;align-items:center;margin:12px 0 0;overflow-x:auto;scrollbar-width:none}

.hint{font-size:12.5px;color:var(--muted);margin:8px 0 0}

.slot{margin-bottom:14px}

.card-head{display:flex;align-items:center;gap:8px;padding:10px 10px 0 10px}

.head-edit:not(:disabled):hover{background:var(--surface-2)}
.head-edit:disabled{cursor:default}
.pen{color:var(--muted);font-size:13px;flex:0 0 auto}
.facts li.spent{background:var(--coral-soft);color:var(--coral)}
.tide-add{margin-top:12px;width:100%;border:0;border-radius:14px;background:var(--coral);color:#fff;font-weight:700;font-size:15px;min-height:46px}
.time{background:var(--sea-soft);color:var(--sea);font-weight:800;font-size:14px;border-radius:10px;padding:4px 10px}
.slot-title{flex:1;min-width:0;font-size:13.5px;font-weight:600;color:var(--muted);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.round{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:16px;color:var(--muted);flex:0 0 auto}
.round.on{background:var(--ok);border-color:var(--ok);color:#fff}
.photo{aspect-ratio:16/9;margin:12px 14px 0;border-radius:16px;overflow:hidden;background:var(--sea-soft)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.body{padding:10px 14px 14px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--surface-2);color:var(--muted)}

.badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.opt-name{font-size:19px;font-weight:800;margin:0;line-height:1.3;letter-spacing:-.01em}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0;padding:0;list-style:none}

.desc{margin:10px 0 0}
.note{margin:10px 0 0;padding:9px 12px;border-radius:12px;background:#FFF6DD;color:#5A4300;font-size:13.5px}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 14px;font-weight:700;font-size:14px;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px}
.btn.primary{background:var(--sea);border-color:var(--sea);color:var(--sea-ink)}
.btn.swap{border-color:var(--coral);color:var(--coral);background:var(--coral-soft)}
.btn.swap b{background:var(--coral);color:#fff;border-radius:999px;font-size:12px;min-width:20px;height:20px;display:inline-grid;place-items:center;padding:0 6px}
.btn.danger{color:var(--danger)}
.btn.danger.armed,.menu button.armed{background:var(--danger);border-color:var(--danger);color:#fff}
.edit-cell{cursor:pointer}
.edit-cell .pen{margin-left:4px}
.btn.small{padding:6px 12px;font-size:13px;min-height:38px}
.add-slot{width:100%;border:1.5px dashed var(--line);background:transparent;border-radius:18px;padding:14px;color:var(--muted);font-weight:700;min-height:52px}

.scroll{overflow-x:auto}

.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:26px 26px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));overscroll-behavior:contain}

.field{margin-bottom:12px}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet-actions{display:flex;gap:8px;justify-content:space-between;margin-top:8px;flex-wrap:wrap}
.sheet-actions .right{display:flex;gap:8px;margin-left:auto}
.img-prev{margin-top:8px;border-radius:12px;max-height:140px;max-width:100%;display:block}
.current{display:flex;gap:10px;align-items:center;background:var(--sea-soft);border-radius:16px;padding:10px 12px;margin-bottom:14px;font-size:14px}
.current b{display:block;font-size:15px}
.section-label{font-size:13px;font-weight:700;color:var(--muted);margin:0 0 8px}
.bk-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.bk{border:1.5px solid var(--line);border-radius:18px;padding:12px}
.bk-top{display:flex;gap:12px}
.thumb{width:64px;height:64px;border-radius:14px;background:var(--surface-2);flex:0 0 auto;display:grid;place-items:center;font-size:26px;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.bk-info{flex:1;min-width:0}
.bk-info h4{margin:4px 0 0;font-size:16px;line-height:1.3}
.bk-meta{font-size:13px;color:var(--muted);margin:2px 0 0}

.bk-actions{display:flex;gap:8px;margin-top:10px}
.bk-actions .btn.primary{flex:1}
.menu{list-style:none;margin:0;padding:0}
.menu button{width:100%;text-align:left;border:0;background:transparent;padding:14px 6px;font-size:15.5px;font-weight:600;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;min-height:52px}
.menu li:last-child button{border-bottom:0}
.menu button.danger{color:var(--danger)}
.menu button:disabled{opacity:.4}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:14px;max-width:90vw;text-align:center}

</style>

function short(n){n=Number(n)||0;if(Math.abs(n)>=1e6)return (n/1e6).toLocaleString("vi-VN",{maximumFractionDigits:1})+" tr";if(Math.abs(n)>=1e3)return Math.round(n/1e3)+"k";return String(n);}

function qtyOf(o){return (o.qty===undefined||o.qty===null||o.qty==="")?(o.per==="nhom"?1:people()):Math.max(0,Number(o.qty)||0);}
function optCost(o){return (Number(o.price)||0)*qtyOf(o);}
function migrate(st){(st.days||[]).forEach(function(d){d.slots.forEach(function(sl){sl.options.forEach(function(o){if(o.qty===undefined){o.qty=o.per==="nhom"?1:Math.max(1,Number(st.trip.people)||1);}delete o.per;});});});(st.expenses||[]).forEach(function(x){delete x.payer;});}
function sel(slot){return slot.options.filter(function(o){return o.id===slot.selected;})[0]||slot.options[0];}
function mapsDir(o){return "https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(o.place||o.name);}
function mapsSearch(q){return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q);}
function catOf(trigger){return trigger==="re"?"an-uong":"tham-quan";}

function totals(){
  var fixed=0,plan=0,actual=0,byCat={};
  state.fixed.forEach(function(f){fixed+=Number(f.amount)||0;});
  state.days.forEach(function(d){d.slots.forEach(function(s){var o=sel(s);if(o)plan+=optCost(o);});});
  state.expenses.forEach(function(x){actual+=Number(x.amount)||0;byCat[x.cat]=(byCat[x.cat]||0)+(Number(x.amount)||0);});
  return {fixed:fixed,plan:plan,planned:fixed+plan,actual:actual,byCat:byCat,budget:Number(state.trip.budget)||0};
}

function change(fn){if(readOnly){toast("Bạn đang xem ở chế độ chỉ đọc.");return;}fn();dirty=true;try{localStorage.setItem("trip-draft",JSON.stringify({rev:state.rev,state:state}));}catch(e){}render();}

/* ---------- render ---------- */
var flashId=null;
function render(){
  migrate(state);
  var app=document.getElementById("app");
  app.innerHTML='<div class="wrap">'+hero()+tabs()+'<main id="main">'+(ui.tab==="lich-trinh"?plan():ui.tab==="chi-phi"?money():info())+'</main></div>'+saveBar();
  if(flashId){var c=document.querySelector('[data-slot="'+flashId+'"] .card');if(c)c.classList.add("flash");flashId=null;}
}
function dateText(){var t=state.trip;if(!t.dateStart)return "Chưa chọn ngày";var f=function(s){var p=s.split("-");return p[2]+"/"+p[1];};return f(t.dateStart)+(t.dateEnd?" – "+f(t.dateEnd):"");}
function hero(){
  var t=state.trip,T=totals(),b=T.budget||1;
  var fill=Math.min(100,T.actual/b*100),planPos=Math.min(100,T.planned/b*100);
  var left=T.budget-T.planned;
  return '<header class="hero"><div class="hero-top"><div><p class="route">'+esc(t.from)+' ✈ '+esc(t.to)+'</p><h1>'+esc(t.name)+'</h1></div>'+
  (readOnly?'':'<button class="ghost" data-act="edit-trip">Sửa chuyến</button>')+'</div>'+
  '<p class="hero-meta">'+dateText()+', '+people()+' người</p>'+(VIEW_ONLY&&state.exportedAt?'<p class="hero-meta" style="font-size:12px;opacity:.8;margin-top:2px">Bản cập nhật lúc '+stamp(state.exportedAt)+'</p>':'')+
  '<div class="tide"><div class="tide-row"><span>Dự kiến<strong>'+short(T.planned)+'</strong></span><span>Thực tế<strong>'+short(T.actual)+'</strong></span><span style="text-align:right">Ngân sách<strong>'+short(T.budget)+'</strong></span></div>'+
  '<div class="tide-bar" role="img" aria-label="Đã chi '+vnd(T.actual)+', dự kiến '+vnd(T.planned)+' trên ngân sách '+vnd(T.budget)+'"><div class="tide-fill" style="width:'+fill+'%"></div><div class="tide-plan" style="left:calc('+planPos+'% - 1px)"></div></div>'+
  '<div class="tide-legend"><span>Thực tế đã chi</span><span class="plan">Mốc dự kiến</span>'+
  (left<0?'<b class="over">Dự kiến vượt '+vnd(-left)+'</b>':'<b>Dự kiến còn dư '+vnd(left)+'</b>')+'</div>'+(readOnly?'':'<button class="tide-add" data-act="add-exp">＋ Ghi tiền đã chi</button>')+'</div></header>';
}
function tabs(){
  var L={"lich-trinh":["🗓️","Lịch trình"],"chi-phi":["💰","Chi phí"],"thong-tin":["📋","Thông tin"]};
  return '<nav class="nav" role="tablist">'+TABS.map(function(k){return '<button class="tab" role="tab" aria-selected="'+(ui.tab===k)+'" data-act="tab" data-k="'+k+'"><i aria-hidden="true">'+L[k][0]+'</i>'+L[k][1]+'</button>';}).join("")+'</nav>';
}

function plan(){
  if(ui.day>=state.days.length)ui.day=0;
  var d=state.days[ui.day];
  var out='<div class="days">'+state.days.map(function(x,i){
    var c=0;x.slots.forEach(function(s){var o=sel(s);if(o)c+=optCost(o);});
    return '<button class="day-btn" aria-pressed="'+(i===ui.day)+'" data-act="day" data-i="'+i+'"><b>'+esc(x.label)+'</b><small>'+(x.date?esc(x.date.split("-").reverse().slice(0,2).join("/"))+", ":"")+short(c)+'</small></button>';
  }).join("")+(readOnly?'':'<button class="day-btn" data-act="add-day"><b>＋</b><small>Thêm ngày</small></button>')+'</div>';
  out+='<div class="toolbar"><button class="chip'+(state.rainMode?' on':'')+'" data-act="rain">🌧️ '+(state.rainMode?'Đang dùng lịch mưa':'Chuyển lịch mưa')+'</button>'+
    '<a class="chip" href="'+mapsSearch("thời tiết "+state.trip.to)+'" target="_blank" rel="noopener">⛅ Dự báo</a>'+
    (readOnly?'':'<button class="chip" data-act="edit-day">✎ Sửa '+esc(d.label)+'</button>')+'</div>';
  if(state.rainMode)out+='<p class="hint">Các khung có phương án 🌧️ đã được đổi sang. Bấm lại để trả về lịch cũ.</p>';
  out+='<ol class="timeline">'+d.slots.map(slotCard).join("")+'</ol>';
  if(!d.slots.length)out+='<p class="empty">Ngày này chưa có khung giờ nào.</p>';
  if(!readOnly)out+='<button class="add-slot" data-act="add-slot">＋ Thêm khung giờ</button>';
  return out;
}
function factsHtml(o){
  var f=[];
  var q=qtyOf(o);f.push(Number(o.price)?'💰 Dự kiến '+vnd(optCost(o))+(q!==1?' ('+short(o.price)+' × '+q+')':' (1 phần)'):'💰 Miễn phí');
  if(o.duration)f.push('⏱ '+esc(o.duration));
  if(o.hours)f.push('🕘 '+esc(o.hours));
  return f;
}
function slotCard(s){
  var o=sel(s),n=s.options.length-1;
  var head='<div class="card-head"><button class="head-edit" data-act="edit-full" data-s="'+s.id+'"'+(readOnly?' disabled':' aria-label="Sửa '+esc(s.title)+'"')+'><span class="time">'+esc(s.time||'--:--')+'</span><span class="slot-title">'+esc(s.title)+'</span>'+(readOnly?'':'<span class="pen" aria-hidden="true">✎</span>')+'</button>'+
    (readOnly?'':'<button class="round'+(s.done?' on':'')+'" data-act="done" data-s="'+s.id+'" aria-pressed="'+!!s.done+'" aria-label="'+(s.done?'Bỏ đánh dấu đã đi':'Đánh dấu đã đi')+'">✓</button><button class="round" data-act="menu" data-s="'+s.id+'" aria-label="Thêm thao tác">⋯</button>')+'</div>';
  if(!o)return '<li class="slot" data-slot="'+s.id+'"><div class="card">'+head+'<div class="body"><p class="empty">Chưa có phương án nào.</p></div></div></li>';
  var tg=TRIG[o.trigger]||TRIG.chinh;
  var badges='<span class="badge '+esc(o.trigger)+'">'+tg.i+' '+tg.t+'</span>';
  if(s.swapped)badges+='<span class="badge swapped">🔄 Đã đổi</span>';
  var swapBtn=n>0?'<button class="btn swap" data-act="swap" data-s="'+s.id+'" aria-label="Đổi phương án, '+n+' dự phòng">🔄 Đổi<span class="lg"> phương án</span> <b>'+n+'</b></button>'
    :(readOnly?'':'<button class="btn" data-act="add-opt" data-s="'+s.id+'">＋ Thêm dự phòng</button>');
  return '<li class="slot'+(s.done?' done':'')+'" data-slot="'+s.id+'"><div class="card">'+head+
    (o.img?'<div class="photo"><img src="'+esc(o.img)+'" alt="'+esc(o.name)+'" loading="lazy"></div>':'')+
    '<div class="body"><div class="badges">'+badges+'</div><h3 class="opt-name">'+esc(o.name)+'</h3>'+
    '<ul class="facts">'+factsHtml(o).map(function(x){return '<li>'+x+'</li>';}).join("")+(hasSpent(s.id)?'<li class="spent">💸 Thực tế '+vnd(spentFor(s.id))+diffText(spentFor(s.id)-optCost(o))+'</li>':'')+'</ul>'+
    (o.desc?'<p class="desc">'+esc(o.desc)+'</p>':'')+(o.note?'<p class="note">💡 '+esc(o.note)+'</p>':'')+
    '<div class="actions"><a class="btn primary" href="'+mapsDir(o)+'" target="_blank" rel="noopener">📍 Chỉ đường</a>'+swapBtn+
    (readOnly?'':'<button class="btn" data-act="edit-full" data-s="'+s.id+'">✎ Sửa</button><button class="btn" data-act="add-exp" data-s="'+s.id+'">💸 Ghi đã chi</button>')+'</div></div></div></li>';
}
function hasSpent(id){return state.expenses.some(function(x){return x.slot===id;});}
function diffText(d){if(Math.abs(d)<1)return '';return d>0?' (vượt '+short(d)+')':' (ít hơn '+short(-d)+')';}
function spentFor(id){var t=0;state.expenses.forEach(function(x){if(x.slot===id)t+=Number(x.amount)||0;});return t;}
function byTime(x,y){return String(x.time).localeCompare(String(y.time));}
function slotChoices(){var r=[["","Không gắn hoạt động"]];state.fixed.forEach(function(f){r.push([f.id,"Cố định: "+f.name]);});state.days.forEach(function(d){d.slots.forEach(function(s){var o=sel(s);r.push([s.id,d.label+", "+s.time+" "+(o?o.name:s.title)]);});});return r;
}

/* ---------- backup sheet & menus ---------- */
function openSheet(inner,label,onAct){
  closeForm();
  var ov=document.createElement("div");ov.className="overlay";ov.id="overlay";
  ov.innerHTML='<div class="sheet" role="dialog" aria-modal="true" aria-label="'+esc(label)+'">'+inner+'</div>';
  document.body.appendChild(ov);
  var f=ov.querySelector("button,a");if(f)f.focus();
  ov.addEventListener("click",function(e){if(e.target===ov){closeForm();return;}var b=e.target.closest("[data-sa]");if(b){onAct(b.dataset.sa,b);}});
  ov.addEventListener("keydown",function(e){if(e.key==="Escape")closeForm();});
}
function swapSheet(sid){
  var f=findSlot(sid),s=f.slot,o=sel(s);
  var backups=s.options.filter(function(x){return x.id!==s.selected;});
  var html='<h3>Đổi phương án</h3><p class="lead">'+esc(s.time)+', '+esc(s.title)+'</p>'+
    '<div class="current">'+(o.img?'<div class="thumb" style="width:48px;height:48px"><img src="'+esc(o.img)+'" alt=""></div>':'')+'<div><small>Đang trong lịch trình</small><b>'+esc(o.name)+'</b></div></div>'+
    '<p class="section-label">Dự phòng ('+backups.length+')</p><ul class="bk-list">'+
    backups.map(function(x){var tg=TRIG[x.trigger]||TRIG.chinh;
      return '<li class="bk"><div class="bk-top">'+(x.img?'<div class="thumb"><img src="'+esc(x.img)+'" alt=""></div>':'')+'<div class="bk-info">'+
        '<span class="badge '+esc(x.trigger)+'">'+tg.i+' '+tg.t+'</span>'+(s.last===x.id?' <span class="badge swapped">Lịch cũ</span>':'')+
        '<h4>'+esc(x.name)+'</h4><p class="bk-meta">'+factsHtml(x).join(", ")+'</p>'+(x.desc?'<p class="bk-desc">'+esc(x.desc)+'</p>':'')+'</div></div>'+
        '<div class="bk-actions">'+(readOnly?'':'<button class="btn primary small" data-sa="pick" data-o="'+x.id+'">Chọn phương án này</button>')+
        '<a class="btn small" href="'+mapsDir(x)+'" target="_blank" rel="noopener" aria-label="Chỉ đường">📍</a>'+
        (readOnly?'':'<button class="btn small" data-sa="edit" data-o="'+x.id+'" aria-label="Sửa">✎</button>')+'</div></li>';}).join("")+'</ul>'+
    (backups.length?'':'<p class="empty">Chưa có dự phòng cho khung này.</p>')+
    '<div class="sheet-actions">'+(readOnly?'':'<button class="btn" data-sa="add">＋ Thêm dự phòng</button>')+'<div class="right"><button class="btn" data-sa="close">Đóng</button></div></div>';
  openSheet(html,"Đổi phương án",function(act,b){
    if(act==="close")closeForm();
    else if(act==="add"){addOption(f);}
    else if(act==="edit"){editOption(f,byId(s.options,b.dataset.o),true);}
    else if(act==="pick"){
      var nx=byId(s.options,b.dataset.o),old=o;closeForm();
      change(function(){
        removeId(s.options,nx.id);s.options.unshift(nx);
        removeId(s.options,old.id);s.options.splice(1,0,old);
        s.selected=nx.id;s.last=old.id;s.swapped=true;delete s.prev;
      });
      flashId=s.id;render();
      toast("Đã đổi sang "+nx.name+". "+old.name+" chuyển vào dự phòng.");
    }
  });
}
function addOption(f){openForm("Thêm dự phòng cho "+f.slot.title,OPT_FIELDS,{trigger:"mua",qty:people(),price:0},function(v){v.id=uid();f.slot.options.push(v);});}
function editOption(f,o,back){
  openForm("Sửa phương án",OPT_FIELDS,o,function(v){Object.assign(o,v);},
    f.slot.options.length>1?function(){removeId(f.slot.options,o.id);if(f.slot.selected===o.id)f.slot.selected=f.slot.options[0].id;}:null);
}
function slotMenu(sid){
  var f=findSlot(sid),arr=f.day.slots,i=arr.indexOf(f.slot);
  var html='<h3>'+esc(f.slot.time)+', '+esc(f.slot.title)+'</h3><p class="lead">Thao tác với khung giờ</p><ul class="menu">'+
    '<li><button data-sa="edit-cur">✎ Sửa phương án đang chọn</button></li>'+
    '<li><button data-sa="add">＋ Thêm phương án dự phòng</button></li>'+
    '<li><button data-sa="edit-slot">🕘 Đổi giờ, tên khung</button></li>'+
    '<li><button data-sa="up"'+(i===0?' disabled':'')+'>↑ Đưa lên trên</button></li>'+
    '<li><button data-sa="down"'+(i===arr.length-1?' disabled':'')+'>↓ Đưa xuống dưới</button></li>'+
    '<li><button data-sa="del" class="danger">🗑 Xoá khung giờ</button></li></ul>';
  openSheet(html,"Thao tác",function(act,b){
    if(act==="edit-cur")editOption(f,sel(f.slot));
    else if(act==="add")addOption(f);
    else if(act==="edit-slot")openForm("Đổi giờ, tên khung",[{row:[{k:"time",label:"Giờ",ph:"15:00"},{k:"title",label:"Tên khung",ph:"Buổi chiều"}]}],f.slot,function(v){f.slot.time=v.time;f.slot.title=v.title;});
    else if(act==="up"||act==="down"){closeForm();change(function(){var j=i+(act==="up"?-1:1);arr.splice(i,1);arr.splice(j,0,f.slot);});}
    else if(act==="del"){if(b.dataset.armed){closeForm();change(function(){removeId(arr,f.slot.id);});}else{b.dataset.armed="1";b.textContent="🗑 Bấm lần nữa để xoá khung giờ";b.classList.add("armed");}}
  });
}

function money(){
  var T=totals(),out='',ro=readOnly;
  out+='<section class="panel"><h2>Tổng quan</h2><p class="hint" style="margin:0 0 10px">Dự kiến là giá bạn nhập cho phương án chính và chi phí cố định. Thực tế là số tiền bạn ghi ở nút Ghi đã chi.</p><div class="stats">'+
    '<div class="stat"><small>Dự kiến</small><b>'+vnd(T.planned)+'</b></div>'+
    '<div class="stat"><small>Thực tế đã chi</small><b>'+vnd(T.actual)+'</b></div>'+
    '<div class="stat"><small>Ngân sách</small><b>'+vnd(T.budget)+'</b></div>'+
    '<div class="stat"><small>Còn lại theo dự kiến</small><b'+(T.budget-T.planned<0?' class="over"':'')+'>'+vnd(T.budget-T.planned)+'</b></div>'+
    '<div class="stat"><small>Còn lại thực tế</small><b'+(T.budget-T.actual<0?' class="over"':'')+'>'+vnd(T.budget-T.actual)+'</b></div></div></section>';
  var rows=[],pT=0,aT=0;
  state.fixed.forEach(function(f){rows.push({id:f.id,f:1,name:f.name,sub:"Cố định",plan:Number(f.amount)||0});});
  state.days.forEach(function(d){d.slots.forEach(function(sl){var o=sel(sl);if(!o)return;rows.push({id:sl.id,name:o.name,sub:d.label+", "+sl.time,plan:optCost(o)});});});
  out+='<section class="panel"><h2>Dự kiến và thực tế</h2><div class="scroll"><table class="cmp"><thead><tr><th>Khoản</th><th class="num">Dự kiến</th><th class="num">Thực tế</th>'+(ro?'':'<th></th>')+'</tr></thead><tbody>'+
    rows.map(function(r){var has=hasSpent(r.id),act=spentFor(r.id);pT+=r.plan;aT+=act;var d=act-r.plan;
      return '<tr><td'+(ro?'':' class="edit-cell" data-act="'+(r.f?'edit-fixed':'edit-full')+'" '+(r.f?'data-x':'data-s')+'="'+r.id+'"')+'>'+esc(r.name)+(ro?'':'<span class="pen" aria-hidden="true">✎</span>')+'<br><small>'+esc(r.sub)+'</small></td><td class="num">'+(r.plan?short(r.plan):'0')+'</td><td class="num"'+(has&&d>1?' style="color:var(--danger)"':has&&d<-1?' style="color:var(--ok)"':'')+'>'+(has?short(act):'<small>Chưa ghi</small>')+'</td>'+
      (ro?'':'<td class="num"><button class="plus" data-act="add-exp" data-'+(r.f?'f':'s')+'="'+r.id+'" aria-label="Ghi đã chi cho '+esc(r.name)+'">＋</button></td>')+'</tr>';}).join("")+
    '</tbody><tfoot><tr><td>Tổng</td><td class="num">'+short(pT)+'</td><td class="num">'+short(aT)+'</td>'+(ro?'':'<td></td>')+'</tr></tfoot></table></div>'+
    (T.actual-aT>0?'<p class="hint">Thêm '+vnd(T.actual-aT)+' thực tế chưa gắn khoản nào (nước, quà, lặt vặt).</p>':'')+'</section>';
  out+='<section class="panel"><div class="panel-head"><h2>Nhật ký chi tiêu</h2>'+(ro?'':'<button class="btn primary small" data-act="add-exp">＋ Ghi đã chi</button>')+'</div>';
  if(!state.expenses.length)out+='<p class="empty">Chưa ghi khoản nào. Bấm ＋ ở bảng trên hoặc nút Ghi đã chi trên lịch trình mỗi khi trả tiền.</p>';
  else out+='<div class="scroll"><table><tbody>'+
    state.expenses.slice().reverse().map(function(x){return '<tr data-act="'+(ro?'':'edit-exp')+'" data-x="'+x.id+'" style="cursor:pointer"><td>'+esc(x.desc)+'<br><small style="color:var(--muted)">'+esc(CATS[x.cat]||"")+(x.day?", "+esc(x.day):"")+'</small></td><td class="num">'+vnd(x.amount)+'</td></tr>';}).join("")+'</tbody></table></div>';
  out+='</section>';
  var keys=Object.keys(CATS),max=0;keys.forEach(function(k){max=Math.max(max,T.byCat[k]||0);});
  if(T.actual)out+='<section class="panel"><h2>Thực tế theo hạng mục</h2><div class="cats">'+keys.filter(function(k){return T.byCat[k];}).map(function(k){return '<div class="cat-row"><span>'+CATS[k]+'</span><div class="cat-bar"><i style="width:'+(T.byCat[k]/max*100)+'%"></i></div><b>'+short(T.byCat[k])+'</b></div>';}).join("")+'</div></section>';
  out+='<section class="panel"><div class="panel-head"><h2>Chi phí cố định</h2>'+(ro?'':'<button class="btn small" data-act="add-fixed">＋ Thêm</button>')+'</div><p class="hint" style="margin-top:0">Vé máy bay, khách sạn, đưa đón. Số tiền ở đây được tính vào dự kiến, bấm vào để sửa.</p><div class="scroll"><table><tbody>'+
    state.fixed.map(function(f){return '<tr data-act="'+(ro?'':'edit-fixed')+'" data-x="'+f.id+'" style="cursor:pointer"><td>'+esc(f.name)+'<br><small style="color:var(--muted)">'+esc(CATS[f.cat]||"")+'</small></td><td class="num">'+vnd(f.amount)+'</td></tr>';}).join("")+'</tbody></table></div></section>';
  return out;
}

function info(){
  var I=state.info,out='';
  out+='<section class="panel"><div class="panel-head"><h2>Đặt chỗ</h2>'+(readOnly?'':'<button class="btn small" data-act="add-book">＋ Thêm</button>')+'</div><ul class="list">'+
    I.bookings.map(function(b){return '<li><div class="grow"><b>'+esc(b.title)+'</b><p>'+esc(b.detail)+'</p></div>'+(readOnly?'':'<button class="icon-btn" data-act="edit-book" data-x="'+b.id+'">Sửa</button>')+'</li>';}).join("")+'</ul></section>';
  var dn=I.checklist.filter(function(c){return c.done;}).length;
  out+='<section class="panel"><h2>Hành lý '+dn+'/'+I.checklist.length+'</h2><ul class="list">'+

function buildHtml(viewOnly,stOverride){
  var css=document.getElementById("css").textContent,js=document.getElementById("app-js").textContent;
  var data=JSON.stringify(viewOnly?Object.assign({},stOverride||state,{exportedAt:Date.now()}):state).replace(/</g,"\\u003c");
  return "<!doctype html>\n<html lang=\"vi\">\n<head>\n"+HEAD+"\n<style id=\"css\">"+css+"</style>\n</head>\n<body>\n<div id=\"app\"></div>\n<script type=\"application/json\" id=\"trip-data\">"+data+"<\/script>\n"+(viewOnly?"<script>window.__VIEW_ONLY__=true<\/script>\n":"")+"<script id=\"app-js\">"+js+"<\/script>\n</body>\n</html>\n";
}
function save(){
  if(!dirty||saving||readOnly)return;
  if(artifactApi){
    saving=true;render();keepUi();
    var prev=state.rev||0;state.rev=prev+1;state.savedAt=Date.now();
    artifactApi.publish(buildHtml()).then(function(){saving=false;dirty=false;try{localStorage.removeItem("trip-draft");}catch(e){}render();toast("Đã lưu.");},function(err){
      state.rev=prev;saving=false;var c=err&&err.code;
      if(c==="conflict")toast("Có người vừa lưu bản khác, trang đang tải lại bản mới nhất.");
      else if(["not_writer","not_granted","consent_required","capability_disabled","capability_removed","not_declared"].indexOf(c)>-1){readOnly=true;toast("Trang này đang ở chế độ chỉ đọc với bạn.");}
      else if(c==="rate_limited")toast("Lưu hơi dồn dập, đợi vài giây rồi bấm lại.");
      else toast("Chưa lưu được. Thay đổi vẫn giữ trên máy này, hãy bấm Lưu lại.");
      render();});
  }else{
    state.savedAt=Date.now();
    try{localStorage.setItem("trip-local",JSON.stringify(state));localStorage.removeItem("trip-draft");dirty=false;toast("Đã lưu trên trình duyệt này.");}catch(e){toast("Trình duyệt không cho lưu.");}
    render();
  }
}
function useLocal(){
  mode="local";
  try{var l=JSON.parse(localStorage.getItem("trip-local")||"null");if(l&&l.savedAt>(state.savedAt||0)&&!dirty){state=l;render();}}catch(e){}
}

  C.use("artifact").then(function(a){artifactApi=a;if(a)mode="cloud";else useLocal();render();},function(){useLocal();});
  C.use("assets").then(function(x){assetsApi=x;},function(){});
  C.use("downloads").then(function(x){downloadsApi=x;render();},function(){});
}else if(!VIEW_ONLY)useLocal();
function stamp(t){
return __stamp(t);}
function toDataUrl(url){return new Promise(function(res){var im=new Image();im.onload=function(){try{var m=1200,w=im.naturalWidth,h=im.naturalHeight,k=Math.min(1,m/Math.max(w,h)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(w*k));c.height=Math.max(1,Math.round(h*k));c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",0.82));}catch(e){res(null);}};im.onerror=function(){res(null);};im.src=url;});}
function __stamp(t){var d=new Date(t),p=function(n){return (n<10?'0':'')+n;};return p(d.getHours())+':'+p(d.getMinutes())+', '+p(d.getDate())+'/'+p(d.getMonth()+1);}
})();
