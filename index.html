<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Đà Nẵng 2 ngày</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="css">
:root{
  --bg:#F2FBFD;--surface:#FFFFFF;--surface-2:#E9F6F9;--ink:#0F2D3A;--muted:#557280;
  --sea:#0A7F94;--sea-ink:#FFFFFF;--hero:#5AD6E4;--hero-ink:#06323C;--sea-soft:#D4F1F5;
  --sun:#FFB627;--coral:#F2613F;--coral-soft:#FFE6DF;--rain:#2F6FDB;--rain-soft:#E1EBFC;
  --line:#D6EAEE;--danger:#C73E22;--ok:#1F8A5B;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C1D25;--surface:#142B35;--surface-2:#1A3541;--ink:#E6F2F4;--muted:#97B0B9;
    --sea:#5FD0DE;--sea-ink:#06232B;--hero:#127B8C;--hero-ink:#F2FDFF;--sea-soft:#1D4652;
    --sun:#FFC24D;--coral:#FF8A6E;--coral-soft:#3A2620;--rain:#86A9F0;--rain-soft:#1E2C47;
    --line:#26444F;--danger:#FF8A70;--ok:#6CD3A0;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1D25;--surface:#142B35;--surface-2:#1A3541;--ink:#E6F2F4;--muted:#97B0B9;
  --sea:#5FD0DE;--sea-ink:#06232B;--hero:#127B8C;--hero-ink:#F2FDFF;--sea-soft:#1D4652;
  --sun:#FFC24D;--coral:#FF8A6E;--coral-soft:#3A2620;--rain:#86A9F0;--rain-soft:#1E2C47;
  --line:#26444F;--danger:#FF8A70;--ok:#6CD3A0;color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 16px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.55 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--sea)}
:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 14px 190px}

/* hero */
.hero{background:var(--hero);color:var(--hero-ink);padding:22px 18px 20px;border-radius:0 0 26px 26px;margin:0 -14px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-50px;width:170px;height:170px;border-radius:50%;background:var(--sun);opacity:.85}
.hero>*{position:relative;z-index:1}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.route{font-size:13px;font-weight:600;margin:0 0 4px;opacity:.85}
.hero h1{font-size:clamp(28px,8.5vw,44px);line-height:1.05;font-weight:800;letter-spacing:-.02em;margin:0}
.hero-meta{margin:8px 0 0;font-size:14px;font-weight:500}
.ghost{background:rgba(255,255,255,.55);border:0;color:var(--hero-ink);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;white-space:nowrap;min-height:36px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ghost{background:rgba(0,0,0,.25)}}
.tide{margin-top:18px;background:rgba(255,255,255,.6);border-radius:18px;padding:12px 14px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tide{background:rgba(0,0,0,.22)}}
.tide-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:12.5px;font-weight:600}
.tide-row strong{font-size:21px;font-weight:800;letter-spacing:-.01em;display:block}
.cmp td small{color:var(--muted)}
.cmp tfoot td{font-weight:800;border-top:2px solid var(--line)}
.plus{border:0;background:var(--coral-soft);color:var(--coral);border-radius:10px;font-weight:700;padding:6px 10px;min-height:34px;white-space:nowrap}
.tide-bar{position:relative;height:12px;border-radius:999px;background:rgba(15,45,58,.12);margin:10px 0 8px}
.tide-fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--coral)}
.tide-plan{position:absolute;top:-4px;bottom:-4px;width:3px;border-radius:2px;background:currentColor}
.tide-legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px}
.tide-legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--coral)}
.tide-legend span.plan::before{width:3px;background:currentColor}
.over{color:var(--danger);font-weight:800}

/* navigation: bottom bar on phones, top tabs on wide screens */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);display:flex;gap:4px;padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{flex:1;border:0;background:transparent;border-radius:14px;padding:6px 4px;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted)}
.tab i{font-style:normal;font-size:20px;line-height:1}
.tab[aria-selected="true"]{color:var(--sea);background:var(--sea-soft)}
@media (min-width:720px){
  .nav{position:sticky;top:env(safe-area-inset-top,0px);bottom:auto;background:var(--bg);border:0;padding:14px 0 8px;margin:0}
  .tab{flex-direction:row;gap:8px;font-size:14px;min-height:44px}
  .tab i{font-size:16px}
  .tab[aria-selected="true"]{background:var(--surface);box-shadow:0 1px 0 var(--line)}
  .wrap{padding-bottom:120px}
}

/* day switch */
.days{display:flex;gap:8px;overflow-x:auto;padding:16px 2px 4px;margin:0 -14px;padding-left:14px;padding-right:14px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day-btn{flex:0 0 auto;border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:8px 16px;text-align:left;min-height:52px}
.day-btn b{display:block;font-size:15px}
.day-btn small{color:var(--muted);font-size:12px}
.day-btn[aria-pressed="true"]{border-color:var(--sea);background:var(--sea);color:var(--sea-ink)}
.day-btn[aria-pressed="true"] small{color:inherit;opacity:.85}
.toolbar{display:flex;gap:8px;align-items:center;margin:12px 0 0;overflow-x:auto;scrollbar-width:none}
.toolbar::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:600;text-decoration:none;color:var(--ink);min-height:38px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--rain);border-color:var(--rain);color:#fff}
.hint{font-size:12.5px;color:var(--muted);margin:8px 0 0}

/* slot cards */
.timeline{list-style:none;margin:14px 0 0;padding:0}
.slot{margin-bottom:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 2px 0 var(--line)}
.slot.done .card{opacity:.6}
.card-head{display:flex;align-items:center;gap:8px;padding:10px 10px 0 10px}
.head-edit{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:0;background:transparent;text-align:left;padding:6px 4px;border-radius:12px;min-height:44px}
.head-edit:not(:disabled):hover{background:var(--surface-2)}
.head-edit:disabled{cursor:default}
.pen{color:var(--muted);font-size:13px;flex:0 0 auto}
.facts li.spent{background:var(--coral-soft);color:var(--coral)}
.tide-add{margin-top:12px;width:100%;border:0;border-radius:14px;background:var(--coral);color:#fff;font-weight:700;font-size:15px;min-height:46px}
.time{background:var(--sea-soft);color:var(--sea);font-weight:800;font-size:14px;border-radius:10px;padding:4px 10px}
.slot-title{flex:1;min-width:0;font-size:13.5px;font-weight:600;color:var(--muted);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.round{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:16px;color:var(--muted);flex:0 0 auto}
.round.on{background:var(--ok);border-color:var(--ok);color:#fff}
.photo{aspect-ratio:16/9;margin:12px 14px 0;border-radius:16px;overflow:hidden;background:var(--sea-soft)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.body{padding:10px 14px 14px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--surface-2);color:var(--muted)}
.badge.mua{background:var(--rain-soft);color:var(--rain)}
.badge.swapped{background:var(--coral-soft);color:var(--coral)}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.opt-name{font-size:19px;font-weight:800;margin:0;line-height:1.3;letter-spacing:-.01em}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0;padding:0;list-style:none}
.facts li{background:var(--surface-2);border-radius:10px;padding:5px 10px;font-size:13px;font-weight:600}
.desc{margin:10px 0 0}
.note{margin:10px 0 0;padding:9px 12px;border-radius:12px;background:#FFF6DD;color:#5A4300;font-size:13.5px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .note{background:#3A3215;color:#F6E2A6}}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 14px;font-weight:700;font-size:14px;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px}
.btn.primary{background:var(--sea);border-color:var(--sea);color:var(--sea-ink)}
.btn.swap{border-color:var(--coral);color:var(--coral);background:var(--coral-soft)}
.btn.swap b{background:var(--coral);color:#fff;border-radius:999px;font-size:12px;min-width:20px;height:20px;display:inline-grid;place-items:center;padding:0 6px}
.btn.danger{color:var(--danger)}
.btn.danger.armed,.menu button.armed{background:var(--danger);border-color:var(--danger);color:#fff}
.edit-cell{cursor:pointer}
.edit-cell .pen{margin-left:4px}
.btn.small{padding:6px 12px;font-size:13px;min-height:38px}
.add-slot{width:100%;border:1.5px dashed var(--line);background:transparent;border-radius:18px;padding:14px;color:var(--muted);font-weight:700;min-height:52px}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;margin-top:14px}
.panel h2{font-size:17px;margin:0 0 4px}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:4px}
@media (min-width:560px){.stats{grid-template-columns:repeat(3,1fr)}}
.stat{background:var(--surface-2);border-radius:14px;padding:12px}
.stat small{color:var(--muted);display:block;font-size:12px}
.stat b{font-size:17px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600}
td.num,th.num{text-align:right;white-space:nowrap}
tr:last-child td{border-bottom:0}
.cats{display:flex;flex-direction:column;gap:10px}
.cat-row{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;font-size:14px}
.cat-bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.cat-bar i{display:block;height:100%;background:var(--sea);border-radius:999px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);min-height:48px}
.list li:last-child{border-bottom:0}
.list .grow{flex:1;min-width:0}
.list .grow p{margin:2px 0 0;color:var(--muted);font-size:13.5px;white-space:pre-wrap}
.check{width:22px;height:22px;accent-color:var(--sea);flex:0 0 auto}
.icon-btn{border:0;background:transparent;color:var(--muted);border-radius:10px;padding:8px 10px;font-size:14px;min-height:40px}
.inline-add{display:flex;gap:8px;margin-top:10px}
.inline-add input{flex:1;min-width:0}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=tel],select,textarea{width:100%;border:1.5px solid var(--line);background:var(--surface-2);border-radius:12px;padding:10px 12px;font-size:16px}
textarea{min-height:80px;resize:vertical}
.settle{font-size:14px;margin:8px 0 0}
.empty{color:var(--muted);font-size:14px;padding:6px 0}

/* save bar sits above the bottom nav on phones */
.savebar{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:20;padding:0 12px 8px;display:flex;justify-content:center;pointer-events:none}
@media (min-width:720px){.savebar{bottom:0;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}}
.savebar-in{pointer-events:auto;display:flex;gap:12px;align-items:center;background:var(--ink);color:var(--bg);border-radius:18px;padding:8px 8px 8px 16px;max-width:700px;width:100%;box-shadow:0 10px 30px rgba(15,45,58,.28);font-size:14px}
.savebar-in span{flex:1}
.savebar-in .btn{background:var(--sun);border-color:var(--sun);color:#2A1C00;min-height:42px}

/* bottom sheets */
.overlay{position:fixed;inset:0;z-index:30;background:rgba(6,30,40,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:26px 26px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));overscroll-behavior:contain}
.sheet::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
@media (min-width:640px){.overlay{align-items:center}.sheet{border-radius:26px;padding-top:18px}.sheet::before{display:none}}
.sheet h3{margin:0;font-size:19px}
.sheet .lead{margin:2px 0 14px;color:var(--muted);font-size:13.5px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:4px}
.field .sub{font-size:12px;color:var(--muted);margin-top:4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet-actions{display:flex;gap:8px;justify-content:space-between;margin-top:8px;flex-wrap:wrap}
.sheet-actions .right{display:flex;gap:8px;margin-left:auto}
.img-prev{margin-top:8px;border-radius:12px;max-height:140px;max-width:100%;display:block}
.current{display:flex;gap:10px;align-items:center;background:var(--sea-soft);border-radius:16px;padding:10px 12px;margin-bottom:14px;font-size:14px}
.current b{display:block;font-size:15px}
.section-label{font-size:13px;font-weight:700;color:var(--muted);margin:0 0 8px}
.bk-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.bk{border:1.5px solid var(--line);border-radius:18px;padding:12px}
.bk-top{display:flex;gap:12px}
.thumb{width:64px;height:64px;border-radius:14px;background:var(--surface-2);flex:0 0 auto;display:grid;place-items:center;font-size:26px;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.bk-info{flex:1;min-width:0}
.bk-info h4{margin:4px 0 0;font-size:16px;line-height:1.3}
.bk-meta{font-size:13px;color:var(--muted);margin:2px 0 0}
.bk-desc{font-size:13.5px;margin:6px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bk-actions{display:flex;gap:8px;margin-top:10px}
.bk-actions .btn.primary{flex:1}
.menu{list-style:none;margin:0;padding:0}
.menu button{width:100%;text-align:left;border:0;background:transparent;padding:14px 6px;font-size:15.5px;font-weight:600;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;min-height:52px}
.menu li:last-child button{border-bottom:0}
.menu button.danger{color:var(--danger)}
.menu button:disabled{opacity:.4}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:14px;max-width:90vw;text-align:center}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .24s cubic-bezier(.2,.8,.3,1)}@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}.card.flash{animation:flash .9s ease-out}@keyframes flash{0%{box-shadow:0 0 0 3px var(--coral)}100%{box-shadow:0 2px 0 var(--line)}}}
</style>
</head>

<script id="app-js">
(function(){
"use strict";
var TRIG={chinh:{i:"☀️",t:"Plan chính"},mua:{i:"🌧️",t:"Nếu mưa"},met:{i:"😮‍💨",t:"Nếu mệt, trễ giờ"},dong:{i:"👥",t:"Nếu đông, đóng cửa"},re:{i:"💸",t:"Tiết kiệm"}};
var CATS={"di-chuyen":"🚗 Di chuyển","luu-tru":"🏨 Lưu trú","an-uong":"🍜 Ăn uống","tham-quan":"🎟️ Tham quan","khac":"🛍️ Khác"};
var HEAD='<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Đà Nẵng 2 ngày</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">';

var state=JSON.parse(document.getElementById("trip-data").textContent);
var dirty=false,readOnly=false,saving=false,artifactApi=null,assetsApi=null,mode="pending";
var ui={tab:"lich-trinh",day:0};
var TABS=["lich-trinh","chi-phi","thong-tin"];
try{var su=JSON.parse(sessionStorage.getItem("trip-ui")||"null");if(su)ui=Object.assign(ui,su);}catch(e){}
var h=(location.hash||"").slice(1);if(TABS.indexOf(h)>-1)ui.tab=h;
var VIEW_ONLY=!!window.__VIEW_ONLY__,downloadsApi=null;if(VIEW_ONLY)readOnly=true;
if(!VIEW_ONLY)try{var dr=JSON.parse(localStorage.getItem("trip-draft")||"null");if(dr&&dr.rev===state.rev&&dr.state){state=dr.state;dirty=true;}}catch(e){}

function uid(){return Math.random().toString(36).slice(2,9);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function vnd(n){return (Math.round(Number(n)||0)).toLocaleString("vi-VN")+" ₫";}
function short(n){n=Number(n)||0;if(Math.abs(n)>=1e6)return (n/1e6).toLocaleString("vi-VN",{maximumFractionDigits:1})+" tr";if(Math.abs(n)>=1e3)return Math.round(n/1e3)+"k";return String(n);}
function people(){return Math.max(1,Number(state.trip.people)||1);}
function qtyOf(o){return (o.qty===undefined||o.qty===null||o.qty==="")?(o.per==="nhom"?1:people()):Math.max(0,Number(o.qty)||0);}
function optCost(o){return (Number(o.price)||0)*qtyOf(o);}
function migrate(st){(st.days||[]).forEach(function(d){d.slots.forEach(function(sl){sl.options.forEach(function(o){if(o.qty===undefined){o.qty=o.per==="nhom"?1:Math.max(1,Number(st.trip.people)||1);}delete o.per;});});});(st.expenses||[]).forEach(function(x){delete x.payer;});}
function sel(slot){return slot.options.filter(function(o){return o.id===slot.selected;})[0]||slot.options[0];}
function mapsDir(o){return "https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(o.place||o.name);}
function mapsSearch(q){return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q);}
function catOf(trigger){return trigger==="re"?"an-uong":"tham-quan";}

function totals(){
  var fixed=0,plan=0,actual=0,byCat={};
  state.fixed.forEach(function(f){fixed+=Number(f.amount)||0;});
  state.days.forEach(function(d){d.slots.forEach(function(s){var o=sel(s);if(o)plan+=optCost(o);});});
  state.expenses.forEach(function(x){actual+=Number(x.amount)||0;byCat[x.cat]=(byCat[x.cat]||0)+(Number(x.amount)||0);});
  return {fixed:fixed,plan:plan,planned:fixed+plan,actual:actual,byCat:byCat,budget:Number(state.trip.budget)||0};
}

function change(fn){if(readOnly){toast("Bạn đang xem ở chế độ chỉ đọc.");return;}fn();dirty=true;try{localStorage.setItem("trip-draft",JSON.stringify({rev:state.rev,state:state}));}catch(e){}render();}

/* ---------- render ---------- */
var flashId=null;
function render(){
  migrate(state);
  var app=document.getElementById("app");
  app.innerHTML='<div class="wrap">'+hero()+tabs()+'<main id="main">'+(ui.tab==="lich-trinh"?plan():ui.tab==="chi-phi"?money():info())+'</main></div>'+saveBar();
  if(flashId){var c=document.querySelector('[data-slot="'+flashId+'"] .card');if(c)c.classList.add("flash");flashId=null;}
}
function dateText(){var t=state.trip;if(!t.dateStart)return "Chưa chọn ngày";var f=function(s){var p=s.split("-");return p[2]+"/"+p[1];};return f(t.dateStart)+(t.dateEnd?" – "+f(t.dateEnd):"");}
function hero(){
  var t=state.trip,T=totals(),b=T.budget||1;
  var fill=Math.min(100,T.actual/b*100),planPos=Math.min(100,T.planned/b*100);
  var left=T.budget-T.planned;
  return '<header class="hero"><div class="hero-top"><div><p class="route">'+esc(t.from)+' ✈ '+esc(t.to)+'</p><h1>'+esc(t.name)+'</h1></div>'+
  (readOnly?'':'<button class="ghost" data-act="edit-trip">Sửa chuyến</button>')+'</div>'+
  '<p class="hero-meta">'+dateText()+', '+people()+' người</p>'+
  '<div class="tide"><div class="tide-row"><span>Dự kiến<strong>'+short(T.planned)+'</strong></span><span>Thực tế<strong>'+short(T.actual)+'</strong></span><span style="text-align:right">Ngân sách<strong>'+short(T.budget)+'</strong></span></div>'+
  '<div class="tide-bar" role="img" aria-label="Đã chi '+vnd(T.actual)+', dự kiến '+vnd(T.planned)+' trên ngân sách '+vnd(T.budget)+'"><div class="tide-fill" style="width:'+fill+'%"></div><div class="tide-plan" style="left:calc('+planPos+'% - 1px)"></div></div>'+
  '<div class="tide-legend"><span>Thực tế đã chi</span><span class="plan">Mốc dự kiến</span>'+
  (left<0?'<b class="over">Dự kiến vượt '+vnd(-left)+'</b>':'<b>Dự kiến còn dư '+vnd(left)+'</b>')+'</div>'+(readOnly?'':'<button class="tide-add" data-act="add-exp">＋ Ghi tiền đã chi</button>')+'</div></header>';
}
function tabs(){
  var L={"lich-trinh":["🗓️","Lịch trình"],"chi-phi":["💰","Chi phí"],"thong-tin":["📋","Thông tin"]};
  return '<nav class="nav" role="tablist">'+TABS.map(function(k){return '<button class="tab" role="tab" aria-selected="'+(ui.tab===k)+'" data-act="tab" data-k="'+k+'"><i aria-hidden="true">'+L[k][0]+'</i>'+L[k][1]+'</button>';}).join("")+'</nav>';
}

function plan(){
  if(ui.day>=state.days.length)ui.day=0;
  var d=state.days[ui.day];
  var out='<div class="days">'+state.days.map(function(x,i){
    var c=0;x.slots.forEach(function(s){var o=sel(s);if(o)c+=optCost(o);});
    return '<button class="day-btn" aria-pressed="'+(i===ui.day)+'" data-act="day" data-i="'+i+'"><b>'+esc(x.label)+'</b><small>'+(x.date?esc(x.date.split("-").reverse().slice(0,2).join("/"))+", ":"")+short(c)+'</small></button>';
  }).join("")+(readOnly?'':'<button class="day-btn" data-act="add-day"><b>＋</b><small>Thêm ngày</small></button>')+'</div>';
  out+='<div class="toolbar"><button class="chip'+(state.rainMode?' on':'')+'" data-act="rain">🌧️ '+(state.rainMode?'Đang dùng lịch mưa':'Chuyển lịch mưa')+'</button>'+
    '<a class="chip" href="'+mapsSearch("thời tiết "+state.trip.to)+'" target="_blank" rel="noopener">⛅ Dự báo</a>'+
    (readOnly?'':'<button class="chip" data-act="edit-day">✎ Sửa '+esc(d.label)+'</button>')+'</div>';
  if(state.rainMode)out+='<p class="hint">Các khung có phương án 🌧️ đã được đổi sang. Bấm lại để trả về lịch cũ.</p>';
  out+='<ol class="timeline">'+d.slots.map(slotCard).join("")+'</ol>';
  if(!d.slots.length)out+='<p class="empty">Ngày này chưa có khung giờ nào.</p>';
  if(!readOnly)out+='<button class="add-slot" data-act="add-slot">＋ Thêm khung giờ</button>';
  return out;
}
function factsHtml(o){
  var f=[];
  var q=qtyOf(o);f.push(Number(o.price)?'💰 Dự kiến '+vnd(optCost(o))+(q!==1?' ('+short(o.price)+' × '+q+')':' (1 phần)'):'💰 Miễn phí');
  if(o.duration)f.push('⏱ '+esc(o.duration));
  if(o.hours)f.push('🕘 '+esc(o.hours));
  return f;
}
function slotCard(s){
  var o=sel(s),n=s.options.length-1;
  var head='<div class="card-head"><button class="head-edit" data-act="edit-full" data-s="'+s.id+'"'+(readOnly?' disabled':' aria-label="Sửa '+esc(s.title)+'"')+'><span class="time">'+esc(s.time||'--:--')+'</span><span class="slot-title">'+esc(s.title)+'</span>'+(readOnly?'':'<span class="pen" aria-hidden="true">✎</span>')+'</button>'+
    (readOnly?'':'<button class="round'+(s.done?' on':'')+'" data-act="done" data-s="'+s.id+'" aria-pressed="'+!!s.done+'" aria-label="'+(s.done?'Bỏ đánh dấu đã đi':'Đánh dấu đã đi')+'">✓</button><button class="round" data-act="menu" data-s="'+s.id+'" aria-label="Thêm thao tác">⋯</button>')+'</div>';
  if(!o)return '<li class="slot" data-slot="'+s.id+'"><div class="card">'+head+'<div class="body"><p class="empty">Chưa có phương án nào.</p></div></div></li>';
  var tg=TRIG[o.trigger]||TRIG.chinh;
  var badges='<span class="badge '+esc(o.trigger)+'">'+tg.i+' '+tg.t+'</span>';
  if(s.swapped)badges+='<span class="badge swapped">🔄 Đã đổi</span>';
  var swapBtn=n>0?'<button class="btn swap" data-act="swap" data-s="'+s.id+'">🔄 Đổi phương án <b>'+n+'</b></button>'
    :(readOnly?'':'<button class="btn" data-act="add-opt" data-s="'+s.id+'">＋ Thêm dự phòng</button>');
  return '<li class="slot'+(s.done?' done':'')+'" data-slot="'+s.id+'"><div class="card">'+head+
    (o.img?'<div class="photo"><img src="'+esc(o.img)+'" alt="'+esc(o.name)+'" loading="lazy"></div>':'')+
    '<div class="body"><div class="badges">'+badges+'</div><h3 class="opt-name">'+esc(o.name)+'</h3>'+
    '<ul class="facts">'+factsHtml(o).map(function(x){return '<li>'+x+'</li>';}).join("")+(hasSpent(s.id)?'<li class="spent">💸 Thực tế '+vnd(spentFor(s.id))+diffText(spentFor(s.id)-optCost(o))+'</li>':'')+'</ul>'+
    (o.desc?'<p class="desc">'+esc(o.desc)+'</p>':'')+(o.note?'<p class="note">💡 '+esc(o.note)+'</p>':'')+
    '<div class="actions"><a class="btn primary" href="'+mapsDir(o)+'" target="_blank" rel="noopener">📍 Chỉ đường</a>'+swapBtn+
    (readOnly?'':'<button class="btn" data-act="edit-full" data-s="'+s.id+'">✎ Sửa</button><button class="btn" data-act="add-exp" data-s="'+s.id+'">💸 Ghi đã chi</button>')+'</div></div></div></li>';
}
function hasSpent(id){return state.expenses.some(function(x){return x.slot===id;});}
function diffText(d){if(Math.abs(d)<1)return '';return d>0?' (vượt '+short(d)+')':' (ít hơn '+short(-d)+')';}
function spentFor(id){var t=0;state.expenses.forEach(function(x){if(x.slot===id)t+=Number(x.amount)||0;});return t;}
function byTime(x,y){return String(x.time).localeCompare(String(y.time));}
function slotChoices(){var r=[["","Không gắn hoạt động"]];state.fixed.forEach(function(f){r.push([f.id,"Cố định: "+f.name]);});state.days.forEach(function(d){d.slots.forEach(function(s){var o=sel(s);r.push([s.id,d.label+", "+s.time+" "+(o?o.name:s.title)]);});});return r;
}

/* ---------- backup sheet & menus ---------- */
function openSheet(inner,label,onAct){
  closeForm();
  var ov=document.createElement("div");ov.className="overlay";ov.id="overlay";

function openForm(title,fields,vals,onSave,onDelete){

  var html='<form class="sheet" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><h3>'+esc(title)+'</h3>';

  ov.innerHTML=html;document.body.appendChild(ov);
  function fieldHtml(f){
    var v=vals[f.k]==null?"":vals[f.k],id="f-"+f.k,inp;
    if(f.type==="textarea")inp='<textarea id="'+id+'" name="'+f.k+'">'+esc(v)+'</textarea>';
    else if(f.type==="select")inp='<select id="'+id+'" name="'+f.k+'">'+f.options.map(function(o){return '<option value="'+esc(o[0])+'"'+(String(o[0])===String(v)?' selected':'')+'>'+esc(o[1])+'</option>';}).join("")+'</select>';
    else if(f.type==="image")inp='<input type="hidden" name="'+f.k+'" value="'+esc(v)+'">'+(assetsApi?'<input type="file" accept="image/*" id="'+id+'" data-img="'+f.k+'">':'<p class="sub">Tải ảnh lên được khi mở trang đã đăng bằng tài khoản có quyền chỉnh sửa.</p>')+(v?'<img class="img-prev" src="'+esc(v)+'" alt=""><button type="button" class="btn small danger" data-clear-img="'+f.k+'" style="margin-top:6px">Bỏ ảnh</button>':'<img class="img-prev" alt="" hidden>');
    else inp='<input id="'+id+'" name="'+f.k+'" type="'+(f.type||"text")+'" value="'+esc(v)+'"'+(f.ph?' placeholder="'+esc(f.ph)+'"':'')+(f.type==="number"?' inputmode="numeric" step="any"':'')+'>';
    return '<div class="field"><label for="'+id+'">'+esc(f.label)+'</label>'+inp+(f.sub?'<p class="sub">'+esc(f.sub)+'</p>':'')+'</div>';
  }
  var form=ov.querySelector("form");

  ov.addEventListener("keydown",function(e){if(e.key==="Escape")closeForm();});
  ov.addEventListener("change",function(e){var t=e.target;if(!t.dataset.img||!t.files[0])return;
    var hid=form.querySelector('[name="'+t.dataset.img+'"]'),im=form.querySelector(".img-prev"),sb=form.querySelector('[type=submit]');
    sb.disabled=true;sb.textContent="Đang tải ảnh…";

    Array.prototype.forEach.call(form.elements,function(el){if(!el.name)return;out[el.name]=el.type==="number"?(el.value===""?0:Number(el.value)):el.value.trim();});

  case "add-opt":addOption(findSlot(S));break;
  case "add-slot":var d=state.days[ui.day];openForm("Thêm khung giờ",[{row:[{k:"time",label:"Giờ",ph:"15:00"},{k:"title",label:"Tên khung",ph:"Buổi chiều"}]},{k:"name",label:"Hoạt động chính"},{k:"place",label:"Địa điểm"},{row:[{k:"price",label:"Giá 1 phần (₫)",type:"number"},{k:"qty",label:"Số phần",type:"number"}]}],{qty:people(),price:0},function(v){var oid=uid();d.slots.push({id:uid(),time:v.time,title:v.title,selected:oid,done:false,options:[{id:oid,trigger:"chinh",name:v.name||"Hoạt động mới",place:v.place,price:v.price,qty:v.qty,duration:"",hours:"",desc:"",note:"",img:""}]});d.slots.sort(function(x,y){return String(x.time).localeCompare(String(y.time));});});break;
  case "edit-day":var dd=state.days[ui.day];openForm("Sửa "+dd.label,[{row:[{k:"label",label:"Tên ngày"},{k:"date",label:"Ngày",type:"date"}]}],dd,function(v){dd.label=v.label;dd.date=v.date;},state.days.length>1?function(){state.days.splice(ui.day,1);ui.day=0;}:null);break;
  case "add-day":change(function(){state.days.push({id:uid(),label:"Ngày "+(state.days.length+1),date:"",slots:[]});ui.day=state.days.length-1;});break;
  case "edit-trip":var t=state.trip;openForm("Thông tin chuyến đi",[{k:"name",label:"Tên chuyến"},{row:[{k:"from",label:"Đi từ"},{k:"to",label:"Đến"}]},{row:[{k:"dateStart",label:"Ngày đi",type:"date"},{k:"dateEnd",label:"Ngày về",type:"date"}]},{row:[{k:"people",label:"Số người",type:"number",sub:"Số phần mặc định cho hoạt động mới."},{k:"budget",label:"Ngân sách (₫)",type:"number"}]}],t,function(v){Object.assign(t,v);});break;
  case "add-exp":case "edit-exp":var x=a==="edit-exp"?byId(state.expenses,X):{cat:"an-uong",day:state.days[ui.day]?state.days[ui.day].label:"",slot:""};var planHint="";
    if(a==="add-exp"&&S){var fs=findSlot(S),os=sel(fs.slot);x.slot=S;x.day=fs.day.label;x.desc=os?os.name:fs.slot.title;x.amount="";planHint=os?"Dự kiến "+vnd(optCost(os)):"";x.cat=/ăn|uống|cà phê/i.test(fs.slot.title+" "+x.desc)?"an-uong":"tham-quan";}
    if(a==="add-exp"&&b.dataset.f){var ffx=byId(state.fixed,b.dataset.f);x.slot=ffx.id;x.desc=ffx.name;x.cat=ffx.cat;x.day="";x.amount="";planHint="Dự kiến "+vnd(ffx.amount);}
    openForm(a==="add-exp"?"Ghi tiền thực tế":"Sửa khoản chi",[{k:"desc",label:"Chi cho gì",ph:"Ăn trưa mì Quảng"},{row:[{k:"amount",label:"Số tiền thực tế (₫)",type:"number",ph:planHint||"0"},{k:"cat",label:"Hạng mục",type:"select",options:Object.keys(CATS).map(function(k){return [k,CATS[k]];})}]},{k:"day",label:"Ngày",type:"select",options:[["",""]].concat(state.days.map(function(d){return [d.label,d.label];}))},{k:"slot",label:"Thuộc hoạt động",type:"select",options:slotChoices(),sub:"Gắn vào hoạt động để so sánh với dự kiến."}],x,
    function(v){if(a==="add-exp"){v.id=uid();state.expenses.push(v);}else Object.assign(x,v);},a==="edit-exp"?function(){removeId(state.expenses,X);}:null);break;
  case "add-fixed":case "edit-fixed":var fx=a==="edit-fixed"?byId(state.fixed,X):{cat:"di-chuyen"};
    openForm("Chi phí cố định",[{k:"name",label:"Khoản"},{row:[{k:"amount",label:"Số tiền (₫)",type:"number"},{k:"cat",label:"Hạng mục",type:"select",options:Object.keys(CATS).map(function(k){return [k,CATS[k]];})}]}],fx,function(v){if(a==="add-fixed"){v.id=uid();state.fixed.push(v);}else Object.assign(fx,v);},a==="edit-fixed"?function(){removeId(state.fixed,X);}:null);break;
  case "add-book":case "edit-book":var bk=a==="edit-book"?byId(state.info.bookings,X):{};
    openForm("Đặt chỗ",[{k:"title",label:"Tên"},{k:"detail",label:"Chi tiết",type:"textarea"}],bk,function(v){if(a==="add-book"){v.id=uid();state.info.bookings.push(v);}else Object.assign(bk,v);},a==="edit-book"?function(){removeId(state.info.bookings,X);}:null);break;
  case "add-contact":case "edit-contact":var ct=a==="edit-contact"?byId(state.info.contacts,X):{};
    openForm("Liên hệ",[{k:"name",label:"Tên"},{k:"phone",label:"Số điện thoại",type:"tel"}],ct,function(v){if(a==="add-contact"){v.id=uid();state.info.contacts.push(v);}else Object.assign(ct,v);},a==="edit-contact"?function(){removeId(state.info.contacts,X);}:null);break;
  case "check":var ck=byId(state.info.checklist,X);change(function(){ck.done=!ck.done;});break;
  case "del-check":change(function(){removeId(state.info.checklist,X);});break;
  case "add-check":var inp=document.getElementById("new-check");if(inp&&inp.value.trim()){var txt=inp.value.trim();change(function(){state.info.checklist.push({id:uid(),text:txt,done:false});});var n=document.getElementById("new-check");if(n)n.focus();}break;
  case "export":var js=JSON.stringify(state,null,2);(navigator.clipboard?navigator.clipboard.writeText(js):Promise.reject()).then(function(){toast("Đã chép JSON.");},function(){openForm("Dữ liệu JSON",[{k:"json",label:"Chọn tất cả rồi chép",type:"textarea"}],{json:js},function(){});});break;
  case "import":openForm("Dán JSON",[{k:"json",label:"JSON chuyến đi",type:"textarea"}],{},function(v){try{var p=JSON.parse(v.json);if(!p.trip||!p.days)throw 0;p.rev=state.rev;p.savedAt=state.savedAt;state=p;}catch(err){toast("JSON không đúng định dạng của trang này.");}});break;
  case "save":save();break;
  case "export-html":if(!downloadsApi)break;downloadsApi.save({filename:"index.html",data:new Blob([buildHtml(true)],{type:"text/html"})}).then(function(r){if(r&&r.status==="saved")toast("Đã tải index.html.");},function(err){var c=err&&err.code||"";if(!/cancel|declin|denied|abort/i.test(c))toast("Chưa tải được ("+(c||"lỗi")+").");});break;
  }
});
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.id==="new-check"){e.preventDefault();var b=document.querySelector('[data-act="add-check"]');if(b)b.click();}});
function keepUi(){try{sessionStorage.setItem("trip-ui",JSON.stringify(ui));}catch(e){}}
function toast(m){var t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove();},2600);}

/* ---------- save ---------- */
function buildHtml(viewOnly){
  var css=document.getElementById("css").textContent,js=document.getElementById("app-js").textContent;
  var data=JSON.stringify(state).replace(/</g,"\\u003c");
  return "<!doctype html>\n<html lang=\"vi\">\n<head>\n"+HEAD+"\n<style id=\"css\">"+css+"</style>\n</head>\n<body>\n<div id=\"app\"></div>\n<script type=\"application/json\" id=\"trip-data\">"+data+"<\/script>\n"+(viewOnly?"<script>window.__VIEW_ONLY__=true<\/script>\n":"")+"<script id=\"app-js\">"+js+"<\/script>\n</body>\n</html>\n";
}
function save(){
  if(!dirty||saving||readOnly)return;
  if(artifactApi){
    saving=true;render();keepUi();
    var prev=state.rev||0;state.rev=prev+1;state.savedAt=Date.now();
    artifactApi.publish(buildHtml()).then(function(){saving=false;dirty=false;try{localStorage.removeItem("trip-draft");}catch(e){}render();toast("Đã lưu.");},function(err){
      state.rev=prev;saving=false;var c=err&&err.code;
      if(c==="conflict")toast("Có người vừa lưu bản khác, trang đang tải lại bản mới nhất.");
      else if(["not_writer","not_granted","consent_required","capability_disabled","capability_removed","not_declared"].indexOf(c)>-1){readOnly=true;toast("Trang này đang ở chế độ chỉ đọc với bạn.");}
      else if(c==="rate_limited")toast("Lưu hơi dồn dập, đợi vài giây rồi bấm lại.");
      else toast("Chưa lưu được. Thay đổi vẫn giữ trên máy này, hãy bấm Lưu lại.");
      render();});
  }else{
    state.savedAt=Date.now();
    try{localStorage.setItem("trip-local",JSON.stringify(state));localStorage.removeItem("trip-draft");dirty=false;toast("Đã lưu trên trình duyệt này.");}catch(e){toast("Trình duyệt không cho lưu.");}
    render();
  }
}
function useLocal(){
  mode="local";
  try{var l=JSON.parse(localStorage.getItem("trip-local")||"null");if(l&&l.savedAt>(state.savedAt||0)&&!dirty){state=l;render();}}catch(e){}
}

render();
var C=VIEW_ONLY?null:window.claude;
if(C&&typeof C.use==="function"){
  C.use("artifact").then(function(a){artifactApi=a;if(a)mode="cloud";else useLocal();render();},function(){useLocal();});
  C.use("assets").then(function(x){assetsApi=x;},function(){});
  C.use("downloads").then(function(x){downloadsApi=x;render();},function(){});
}else useLocal();
})();
</script>
